<style>
*{box-sizing:border-box}
body{

font-family:"Noto Sans JP",Arial,sans-serif;
background:#f7f7f7;
color:#333;
}
.header{
background:#fff;
padding:18px 5%;
font-size:20px;
font-weight:bold;
color:#b71c1c;
border-bottom:1px solid #eee;
}
.hero{
padding:70px 6%;

color:white;

}

.card h3{

}

display:block;
background:#06c755;
color:white;
padding:15px;
border-radius:40px;

あなたが利用できる<br>

<p>
生活・住まい・子育てに関する<br>

</div>

<div class="card">
<div class="icon">👨‍👩‍👧</div>

</div>

<div class="card">

</div>
</div>
</section>


<section class="section">
